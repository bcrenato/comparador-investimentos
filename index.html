<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de CDBs</title>
    <style>
        :root {
            --primary-color: #1b365d;
            --secondary-color: #2c4c7c;
            --accent-color: #00d26a;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .taxa-base {
            background: #e2e8f0;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-top: 5px;
        }

        /* Quadro de Controles Globais */
        .global-controls {
            background: var(--card-bg);
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            gap: 20px;
            border-top: 5px solid var(--secondary-color);
        }

        .global-group {
            flex: 1;
        }

        .global-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .global-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Container dos Cards */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 300px;
            overflow: hidden;
            border-top: 5px solid var(--primary-color);
        }

        .card-header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card-body {
            padding: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .result-group {
            margin-top: 15px;
            border-top: 1px dashed #ddd;
            padding-top: 10px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .result-row span:last-child {
            font-weight: bold;
        }

        .highlight-liquido {
            background-color: #e6f9ed;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid var(--accent-color);
        }

        .highlight-liquido span:last-child {
            color: #008742;
            font-size: 1.05rem;
        }

        .btn-adicionar {
            display: block;
            margin: 25px auto;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-adicionar:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>Comparador de CDBs</h1>
        <div class="taxa-base" id="info-cdi">Carregando taxa do CDI...</div>
    </header>

    <!-- Quadro separado para Valor e Meses (iguais para todos) -->
    <div class="global-controls">
        <div class="global-group">
            <label>Valor Investido (R$)</label>
            <input type="number" step="1000" id="global-valor" value="50000" oninput="calcularTudo()">
        </div>
        <div class="global-group">
            <label>Prazo (Meses)</label>
            <input type="number" id="global-meses" value="6" oninput="calcularTudo()">
        </div>
    </div>

    <!-- Cards de Cenários de Rentabilidade -->
    <div class="container" id="cards-container">
        <!-- Inserido via JavaScript -->
    </div>

    <button class="btn-adicionar" onclick="adicionarCard()">+ Adicionar Cenário</button>

    <script>
        let cdiAnual = 0.149; // Fallback padrão

        async function buscarCDI() {
            try {
                const response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=csv');
                const data = await response.text();
                const linhas = data.split('\n');
                const colunas = linhas[1].split(';');
                let selic = parseFloat(colunas[1].replace(',', '.')) / 100;
                cdiAnual = selic - 0.0010; 
                document.getElementById('info-cdi').innerText = `CDI Atual (BCB): ${(cdiAnual * 100).toFixed(2)}% a.a.`;
                calcularTudo();
            } catch (error) {
                document.getElementById('info-cdi').innerText = `CDI Padrão: ${(cdiAnual * 100).toFixed(2)}% a.a. (Modo Offline)`;
                calcularTudo();
            }
        }

        // Cenários iniciais focados apenas nas diferentes porcentagens
        const dadosIniciais = [
            { rent: 100 },
            { rent: 105 },
            { rent: 120 }
        ];

        function renderizarCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            dadosIniciais.forEach((dado, index) => {
                const cardHTML = `
                    <div class="card" id="card-${index}">
                        <div class="card-header">CDB Cenário ${index + 1}</div>
                        <div class="card-body">
                            <div class="input-group">
                                <label>Rentabilidade (% do CDI)</label>
                                <input type="number" step="0.5" value="${dado.rent}" id="rent-${index}" oninput="calcularTudo()">
                            </div>

                            <div class="result-group">
                                <div class="result-row"><span>Rent. a.a:</span> <span id="res-rent-aa-${index}">-</span></div>
                                <div class="result-row"><span>Valor Bruto:</span> <span id="res-bruto-${index}">-</span></div>
                                <div class="result-row"><span>Rendimentos:</span> <span id="res-lucro-${index}">-</span></div>
                                <div class="result-row"><span>Alíquota IR:</span> <span id="res-ir-aliq-${index}">-</span></div>
                                <div class="result-row"><span>R$ Imposto:</span> <span id="res-ir-val-${index}">-</span></div>
                                <div class="result-row highlight-liquido"><span>Valor Líquido:</span> <span id="res-liquido-${index}">-</span></div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
            calcularTudo();
        }

        function adicionarCard() {
            dadosIniciais.push({ rent: 115 });
            renderizarCards();
        }

        function calcularTudo() {
            const valorInvestido = parseFloat(document.getElementById('global-valor').value) || 0;
            const meses = parseInt(document.getElementById('global-meses').value) || 0;

            dadosIniciais.forEach((_, index) => {
                const rentInput = document.getElementById(`rent-${index}`);
                if (!rentInput) return;

                const rentPct = parseFloat(rentInput.value) / 100;
                const rentAa = cdiAnual * rentPct;

                // Cálculo do valor bruto composto
                const valorBruto = valorInvestido * Math.pow((1 + rentAa), (meses / 12));
                const rendimentos = valorBruto - valorInvestido;

                // Alíquota de IR Regressiva baseada no prazo global em meses
                let aliquotaIR = 0.15;
                if (meses <= 6) aliquotaIR = 0.225;
                else if (meses <= 12) aliquotaIR = 0.20;
                else if (meses <= 24) aliquotaIR = 0.175;

                const valorImposto = rendimentos * aliquotaIR;
                const valorLiquido = valorBruto - valorImposto;

                // Atualizar na tela
                document.getElementById(`res-rent-aa-${index}`).innerText = (rentAa * 100).toFixed(2) + '% a.a.';
                document.getElementById(`res-bruto-${index}`).innerText = valorBruto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById(`res-lucro-${index}`).innerText = rendimentos.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById(`res-ir-aliq-${index}`).innerText = (aliquotaIR * 100) + '%';
                document.getElementById(`res-ir-val-${index}`).innerText = valorImposto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById(`res-liquido-${index}`).innerText = valorLiquido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            });
        }

        // Executar ao carregar
        renderizarCards();
        buscarCDI();
    </script>
</body>
</html>
