<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de CDBs</title>
    <style>
        :root {
            --primary-color: #1b365d;
            --secondary-color: #2c4c7c;
            --accent-color: #00d26a;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .taxa-base-box {
            background: #e2e8f0;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--primary-color);
            margin-top: 8px;
        }

        .taxa-base-box input {
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--primary-color);
            width: 60px;
            text-align: center;
            border-bottom: 1px dashed var(--primary-color);
        }

        /* Quadro de Controles Globais */
        .global-controls {
            background: var(--card-bg);
            max-width: 600px;
            margin: 0 auto 25px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            gap: 20px;
            border-top: 5px solid var(--secondary-color);
        }

        .global-group {
            flex: 1;
        }

        .global-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .global-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Container dos Cards */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 300px;
            overflow: hidden;
            border-top: 5px solid var(--primary-color);
        }

        .card-header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card-body {
            padding: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .result-group {
            margin-top: 15px;
            border-top: 1px dashed #ddd;
            padding-top: 10px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .result-row span:last-child {
            font-weight: bold;
        }

        .highlight-liquido {
            background-color: #e6f9ed;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid var(--accent-color);
        }

        .highlight-liquido span:last-child {
            color: #008742;
            font-size: 1.05rem;
        }

        .highlight-dif {
            background-color: #eef2f7;
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
        }

        .btn-acoes {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-acao {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-remover {
            background: #ff4d4d;
            color: #fff;
        }

        .btn-acao:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>Comparador de CDBs</h1>
        <div class="taxa-base-box">
            CDI Anual: <input type="number" step="0.01" id="input-cdi" value="14.90" oninput="calcularTudo()">% a.a.
            <span id="status-bc" style="font-size: 0.75rem; color: #555; display: block; margin-top: 2px;">(Carregando do BCB...)</span>
        </div>
    </header>

    <!-- Quadro de Controles Globais -->
    <div class="global-controls">
        <div class="global-group">
            <label>Valor Investido (R$)</label>
            <input type="number" step="1000" id="global-valor" value="50000" oninput="calcularTudo()">
        </div>
        <div class="global-group">
            <label>Prazo (Meses)</label>
            <input type="number" id="global-meses" value="12" oninput="calcularTudo()">
        </div>
    </div>

    <!-- Cards de Cenários de Rentabilidade -->
    <div class="container" id="cards-container">
        <!-- Inserido via JavaScript -->
    </div>

    <div class="btn-acoes">
        <button class="btn-acao" onclick="adicionarCard()">+ Adicionar Cenário</button>
        <button class="btn-acao btn-remover" onclick="removerCard()" id="btn-rem" style="display:none;">- Remover Último</button>
    </div>

    <script>
        let dadosIniciais = [
            { rent: 120 },
            { rent: 100 },
            { rent: 105 },
            { rent: 110 }
        ];

        async function buscarCDI() {
            try {
                const response = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json');
                const data = await response.json();
                if (data && data.length > 0) {
                    let selic = parseFloat(data[0].valor);
                    let cdi = selic - 0.10;
                    document.getElementById('input-cdi').value = cdi.toFixed(2);
                    document.getElementById('status-bc').innerText = "Atualizado do Banco Central";
                    calcularTudo();
                }
            } catch (error) {
                document.getElementById('status-bc').innerText = "Usando valor padrão (Modo manual ativo)";
            }
        }

        function renderizarCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            dadosIniciais.forEach((dado, index) => {
                const cardHTML = `
                    <div class="card" id="card-${index}">
                        <div class="card-header">CDB Cenário ${index + 1}</div>
                        <div class="card-body">
                            <div class="input-group">
                                <label>Rentabilidade (% do CDI)</label>
                                <input type="number" step="0.5" value="${dado.rent}" id="rent-${index}" oninput="atualizarEstadoERecalcular()">
                            </div>

                            <div class="result-group">
                                <div class="result-row"><span>Rent. a.a:</span> <span id="res-rent-aa-${index}">-</span></div>
                                <div class="result-row"><span>Valor Bruto:</span> <span id="res-bruto-${index}">-</span></div>
                                <div class="result-row"><span>Rendimentos:</span> <span id="res-lucro-${index}">-</span></div>
                                <div class="result-row"><span>Alíquota IR:</span> <span id="res-ir-aliq-${index}">-</span></div>
                                <div class="result-row"><span>R$ Imposto:</span> <span id="res-ir-val-${index}">-</span></div>
                                <div class="result-row highlight-liquido"><span>Valor Líquido:</span> <span id="res-liquido-${index}">-</span></div>
                                <div class="result-row highlight-dif" id="box-dif-${index}" style="${index === 0 ? 'display:none;' : ''}">
                                    <span id="label-dif-${index}">Dif. p/ Cenário 1:</span> <span id="res-dif-${index}">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            document.getElementById('btn-rem').style.display = dadosIniciais.length > 1 ? 'inline-block' : 'none';
            calcularTudo();
        }

        function atualizarEstadoERecalcular() {
            dadosIniciais.forEach((dado, index) => {
                const input = document.getElementById(`rent-${index}`);
                if (input) dado.rent = parseFloat(input.value) || 0;
            });
            calcularTudo();
        }

        function adicionarCard() {
            dadosIniciais.push({ rent: 115 });
            renderizarCards();
        }

        function removerCard() {
            if (dadosIniciais.length > 1) {
                dadosIniciais.pop();
                renderizarCards();
            }
        }

        function calcularTudo() {
            const cdiAnualInput = parseFloat(document.getElementById('input-cdi').value);
            const cdiAnual = !isNaN(cdiAnualInput) ? cdiAnualInput / 100 : 0.149;

            const valorInvestidoInput = parseFloat(document.getElementById('global-valor').value);
            const valorInvestido = !isNaN(valorInvestidoInput) ? valorInvestidoInput : 0;

            const mesesInput = parseInt(document.getElementById('global-meses').value);
            const meses = !isNaN(mesesInput) ? mesesInput : 0;

            let valorLiquidoBase = 0;

            // Primeiro loop calcula todos os valores líquidos
            let liquidosArray = [];
            dadosIniciais.forEach((dado, index) => {
                const rentInput = document.getElementById(`rent-${index}`);
                if (!rentInput) return;

                const rentPct = parseFloat(rentInput.value) / 100 || 0;
                const rentAa = cdiAnual * rentPct;

                const valorBruto = valorInvestido * Math.pow((1 + rentAa), (meses / 12));
                const rendimentos = valorBruto - valorInvestido;

                let aliquotaIR = 0.15;
                if (meses <= 6) aliquotaIR = 0.225;
                else if (meses <= 12) aliquotaIR = 0.20;
                else if (meses <= 24) aliquotaIR = 0.175;

                const valorImposto = rendimentos * aliquotaIR;
                const valorLiquido = valorBruto - valorImposto;
                liquidosArray.push(valorLiquido);

                if (index === 0) {
                    valorLiquidoBase = valorLiquido;
                }

                // Exibir dados normais
                document.getElementById(`res-rent-aa-${index}`).innerText = (rentAa * 100).toFixed(2) + '% a.a.';
                document.getElementById(`res-bruto-${index}`).innerText = valorBruto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById(`res-lucro-${index}`).innerText = rendimentos.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById(`res-ir-aliq-${index}`).innerText = (aliquotaIR * 100) + '%';
                document.getElementById(`res-ir-val-${index}`).innerText = valorImposto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById(`res-liquido-${index}`).innerText = valorLiquido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            });

            // Segundo loop calcula a diferença em relação ao Cenário 1
            dadosIniciais.forEach((_, index) => {
                if (index > 0) {
                    const dif = liquidosArray[index] - valorLiquidoBase;
                    const spanDif = document.getElementById(`res-dif-${index}`);
                    const sinal = dif >= 0 ? "+ " : "- ";
                    spanDif.innerText = sinal + Math.abs(dif).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    spanDif.style.color = dif >= 0 ? "#008742" : "#d93838";
                }
            });
        }

        renderizarCards();
        buscarCDI();
    </script>
</body>
</html>
